name: CI

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - olliecrow/ci-staging

permissions:
  contents: read

jobs:
  quality:
    name: Go quality
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'Files require gofmt:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build supported platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/slurm-monitor-linux-amd64 ./cmd/slurm-monitor
          GOOS=darwin GOARCH=amd64 go build -o /tmp/slurm-monitor-darwin-amd64 ./cmd/slurm-monitor
          GOOS=darwin GOARCH=arm64 go build -o /tmp/slurm-monitor-darwin-arm64 ./cmd/slurm-monitor

  security:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Security policy
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          extract_dir="${RUNNER_TEMP}/gitleaks-extract"
          mkdir -p "${extract_dir}"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base_url}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${extract_dir}"
          install -m 0755 "${extract_dir}/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan pushed/PR commit range with gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash scripts/security/ci-range.sh)"
          bash scripts/security/gitleaks-range.sh "$range" .gitleaks.toml

      - name: Lint shell scripts
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck -S warning

      - name: Test scanner failures and CI timeouts
        run: |
          bash scripts/security/test-gitleaks-range.sh
          bash scripts/security/test-gitleaks-patches.sh
          bash scripts/security/test-ci-timeouts.sh

      - name: Test commit range selection
        run: bash scripts/security/test-ci-range.sh

      - name: Self-test sensitive text policy
        run: bash scripts/security/test-sensitive-text.sh

      - name: Self-test push and gitleaks scan gaps
        run: bash scripts/security/test-scan-gaps.sh

      - name: Check commit identities and added text for policy violations
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash scripts/security/ci-range.sh)"
          case "$range" in
            *..*)
              export PRE_COMMIT_FROM_REF="${range%%..*}"
              export PRE_COMMIT_TO_REF="${range##*..}"
              ;;
            *)
              export PRE_COMMIT_FROM_REF=""
              export PRE_COMMIT_TO_REF="$range"
              ;;
          esac
          bash scripts/security/check-push-range.sh
          tracked_file="$(mktemp)"
          git ls-files -z >"$tracked_file"
          mapfile -d '' -t tracked_files <"$tracked_file"
          rm -- "$tracked_file"
          bash scripts/security/check-sensitive-text.sh --context=tracked-file "${tracked_files[@]}"

      - name: Check pull request title/body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
