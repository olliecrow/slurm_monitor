name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Go quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'Files require gofmt:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build supported platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/slurm-monitor-linux-amd64 ./cmd/slurm-monitor
          GOOS=darwin GOARCH=amd64 go build -o /tmp/slurm-monitor-darwin-amd64 ./cmd/slurm-monitor
          GOOS=darwin GOARCH=arm64 go build -o /tmp/slurm-monitor-darwin-arm64 ./cmd/slurm-monitor

  security:
    name: Security policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.0"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          extract_dir="${RUNNER_TEMP}/gitleaks-extract"
          mkdir -p "${extract_dir}"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base_url}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks-checksums.txt" "${base_url}/gitleaks_${version}_checksums.txt"
          (
            cd "${RUNNER_TEMP}"
            grep " ${archive}$" gitleaks-checksums.txt | sha256sum -c -
          )
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${extract_dir}"
          install -m 0755 "${extract_dir}/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan pushed/PR commit range with gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "${PUSH_BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            range="${GITHUB_SHA}^!"
          else
            range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi
          gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="${range}"

      - name: Self-test sensitive text policy
        run: bash scripts/security/test-sensitive-text.sh

      - name: Check commit identities and added text for policy violations
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "${PUSH_BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            range="${GITHUB_SHA}^!"
          else
            range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi

          mapfile -t commits < <(git rev-list "${range}")
          bash scripts/security/check-git-identities.sh --context=ci-git-identity "${commits[@]}"

          temp_dir="$(mktemp -d)"
          git log --format='%H%n%s%n%b%n' "${range}" > "${temp_dir}/commit-messages.txt"
          git log --format= --patch --unified=0 --no-color "${range}" \
            | sed -n -e '/^+++ /d' -e 's/^+//p' > "${temp_dir}/added-lines.txt"
          mapfile -d '' -t tracked_files < <(git ls-files -z)
          bash scripts/security/check-sensitive-text.sh --context=tracked-file "${tracked_files[@]}"
          bash scripts/security/check-sensitive-text.sh --context=commit-message "${temp_dir}/commit-messages.txt"
          bash scripts/security/check-sensitive-text.sh --context=added-lines "${temp_dir}/added-lines.txt"

      - name: Check pull request title/body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
